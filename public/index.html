<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Katakana Empat Jam</title>
<meta name="description" content="Latihan menulis katakana dari romaji dalam 4 jam, fokus pada kata serapan, dengan penilaian tulisan tangan otomatis.">
<meta name="theme-color" content="#FBFBFE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13121C" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Katakana 4J">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Klee+One:wght@600&display=swap">
<style>
/* Layout: one-column app on dotted practice paper. Colour carries meaning: each gojūon row (consonant family) owns one hue,
   used on its kana, tiles, pad guides and the mastery map. Red is reserved for the teacher's pen (hanamaru, corrections). */
:root{
  --bg:#FBFBFE; --card:#FFFFFF; --ink:#1D1B2E; --muted:#67657C; --line:#E4E2EE; --dots:#E2E0EC;
  --primary:#7A2E5B; --on-primary:#FFFFFF; --primary-soft:#F6E6EF;
  --shu:#E0362C; --ok:#1E9653; --ok-soft:#E2F5E9; --bad:#D2372D; --bad-soft:#FCE6E4; --warn:#A86A12; --warn-soft:#FCF1DA;
  --r-a:#E5484D; --r-k:#F0661A; --r-s:#DB9A00; --r-t:#2FA84F; --r-n:#0E9F9F; --r-h:#1E88E5; --r-m:#5B5BD6; --r-y:#9B51D0; --r-r:#D6409F; --r-w:#8D6E63;
  --f-ui:"M PLUS Rounded 1c",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-kana:"Klee One","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13121C; --card:#1D1C29; --ink:#EEEDF7; --muted:#A3A1B8; --line:#302E42; --dots:#26253A;
  --primary:#F2A3CC; --on-primary:#3A1028; --primary-soft:#3D2033;
  --shu:#FF6A5E; --ok:#5CCB87; --ok-soft:#173023; --bad:#FF7A70; --bad-soft:#3A1E1C; --warn:#F0C25A; --warn-soft:#3A2F17;
  --r-a:#FF6B70; --r-k:#FF8A45; --r-s:#F2C445; --r-t:#5AC977; --r-n:#30C9C3; --r-h:#55A9FF; --r-m:#8F91F7; --r-y:#C185FA; --r-r:#F36CBA; --r-w:#BC9D90;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13121C; --card:#1D1C29; --ink:#EEEDF7; --muted:#A3A1B8; --line:#302E42; --dots:#26253A;
  --primary:#F2A3CC; --on-primary:#3A1028; --primary-soft:#3D2033;
  --shu:#FF6A5E; --ok:#5CCB87; --ok-soft:#173023; --bad:#FF7A70; --bad-soft:#3A1E1C; --warn:#F0C25A; --warn-soft:#3A2F17;
  --r-a:#FF6B70; --r-k:#FF8A45; --r-s:#F2C445; --r-t:#5AC977; --r-n:#30C9C3; --r-h:#55A9FF; --r-m:#8F91F7; --r-y:#C185FA; --r-r:#F36CBA; --r-w:#BC9D90;
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background-color:var(--bg);background-image:radial-gradient(var(--dots) 1.1px,transparent 1.3px);background-size:22px 22px;color:var(--ink);font:500 16px/1.55 var(--f-ui);-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(96px + env(safe-area-inset-bottom,0px))}
.panel[hidden]{display:none!important}

/* colour helpers: set --c on an element */
.tint{background:color-mix(in oklab,var(--c) 12%,var(--card));border-color:color-mix(in oklab,var(--c) 42%,var(--card))!important}
.cink{color:color-mix(in oklab,var(--c) 82%,var(--ink))}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 4px}
.logo{display:flex;align-items:baseline;gap:8px}
.logo h1{margin:0;font:600 1.7rem/1 var(--f-kana);letter-spacing:.02em}
.logo h1 span{color:color-mix(in oklab,var(--c) 85%,var(--ink))}
.logo small{font:800 .72rem var(--f-ui);letter-spacing:.06em;background:var(--ink);color:var(--bg);padding:3px 8px;border-radius:999px}
.clock{font:700 .85rem var(--f-ui);font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.clock b{color:var(--ink)}
.spectrum{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin:8px 0 14px}
.spectrum i{height:6px;border-radius:3px;background:color-mix(in oklab,var(--c) 22%,var(--card))}
.spectrum i.on{background:var(--c)}

h2{font:800 1.12rem/1.3 var(--f-ui);margin:22px 0 8px;text-wrap:balance}
h3{font:800 1rem/1.35 var(--f-ui);margin:0 0 4px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.kana{font-family:var(--f-kana)}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px 4px}
nav.tabs button{appearance:none;border:0;background:none;color:var(--muted);padding:5px 2px 6px;font:700 .7rem var(--f-ui);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;border-radius:14px}
nav.tabs button .g{font:600 1.3rem/1.1 var(--f-kana)}
nav.tabs button[aria-selected="true"]{color:color-mix(in oklab,var(--c) 85%,var(--ink));background:color-mix(in oklab,var(--c) 14%,var(--card))}
nav.tabs button:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}

/* generic */
.card{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 16px;font:800 .95rem var(--f-ui);cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 3px 0 var(--line);transition:transform .06s,box-shadow .06s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--on-primary);box-shadow:0 3px 0 color-mix(in oklab,var(--primary) 60%,#000)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--card);box-shadow:0 3px 0 color-mix(in oklab,var(--ok) 60%,#000)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--card);box-shadow:0 3px 0 color-mix(in oklab,var(--bad) 60%,#000)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.84rem;border-radius:12px}
.btn[disabled]{opacity:.5;cursor:default;transform:none}
.grow{flex:1 1 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:700 .84rem var(--f-ui);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pill{display:inline-block;font:800 .7rem var(--f-ui);letter-spacing:.05em;padding:3px 9px;border-radius:999px;background:var(--primary-soft);color:var(--primary)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.tint{background:color-mix(in oklab,var(--c) 15%,var(--card))}
.meta{display:flex;justify-content:space-between;gap:12px;font-size:.86rem;color:var(--muted)}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}

/* stroke-order (kakijun) svg */
.kvg{display:block;overflow:visible}
.kvg path{fill:none;stroke:currentColor;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
.kvg.anim path{stroke-dasharray:1;stroke-dashoffset:1;opacity:0;animation:draw .48s ease-out forwards}
@keyframes draw{0%{opacity:1;stroke-dashoffset:1}100%{opacity:1;stroke-dashoffset:0}}
.kvg path.done{stroke:color-mix(in oklab,var(--ink) 22%,var(--card))}
.kvg .num circle{fill:currentColor}
.kvg .num text{fill:var(--card);font:800 6.6px var(--f-ui);text-anchor:middle;dominant-baseline:central}
.strip{display:flex;gap:6px;flex-wrap:wrap}
.strip .bx{width:44px;height:44px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);position:relative;padding:3px}
.strip .bx .kvg{width:100%;height:100%}
.strip .bx .kvg path{stroke-width:5}
.strip .bx b{position:absolute;left:3px;top:1px;font:800 .6rem var(--f-ui);color:var(--muted)}

/* practice pad */
.pad{--c:var(--primary);position:relative;width:100%;max-width:330px;aspect-ratio:1/1;margin:0 auto;background:var(--card);border:2.5px solid color-mix(in oklab,var(--c) 55%,var(--card));border-radius:18px;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.pad.wide{max-width:100%;aspect-ratio:2.4/1}
.pad::before,.pad::after{content:"";position:absolute;pointer-events:none}
.pad::before{left:50%;top:0;bottom:0;border-left:1.5px dashed color-mix(in oklab,var(--c) 35%,var(--card))}
.pad::after{top:50%;left:0;right:0;border-top:1.5px dashed color-mix(in oklab,var(--c) 35%,var(--card))}
.pad.wide::before{display:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;cursor:crosshair}
.pad .ghost{position:absolute;inset:6%;display:flex;align-items:center;justify-content:center;color:color-mix(in oklab,var(--c) 45%,var(--card));z-index:1;opacity:0;transition:opacity .15s}
.pad .ghost.show{opacity:1}
.pad .ghost .kvg{height:100%;max-width:100%}
.pad .ghost .kvg path{stroke-width:6}
.pad .ghost .kvg .num circle{fill:color-mix(in oklab,var(--c) 80%,var(--ink))}
.pad .hm{position:absolute;right:-2%;top:-2%;width:38%;z-index:3;pointer-events:none;color:var(--shu)}
.pad.wide .hm{width:22%;right:0;top:0}
.pad .hm path{fill:none;stroke:currentColor;stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;animation:hm .9s ease-out forwards}
@keyframes hm{to{stroke-dashoffset:0}}
.pad.correct{border-color:var(--ok)}
.pad.wrong{border-color:var(--bad)}

.prompt{text-align:center;padding-block:2px 10px}
.prompt .lbl{font:800 .7rem var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.prompt .rom{font:800 2.8rem/1.05 var(--f-ui);letter-spacing:.01em}
.prompt .rom.long{font-size:2.1rem}
.reveal{text-align:center;min-height:56px;margin-top:6px}
.reveal .ans{font:600 2rem/1.2 var(--f-kana)}
.reveal .ans small{font:700 .9rem var(--f-ui);color:var(--muted);margin-left:6px}
.reveal .mn{font-size:.9rem;color:var(--muted);max-width:44ch;margin:2px auto 0}
.verdict{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:.88rem;color:var(--muted)}
.verdict .kana{font-size:1.2rem;color:var(--ink)}
.tools{display:flex;gap:8px;justify-content:center;margin-top:10px}
.actions{display:flex;gap:8px;margin-top:12px}
.actions .btn{flex:1 1 0}
.kbd{font:500 .74rem var(--f-ui);color:var(--muted);text-align:center;margin-top:10px}

/* learn */
.rowlist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.rowbtn{appearance:none;text-align:left;border:1.5px solid;border-radius:var(--r);padding:10px 12px;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink);position:relative}
.rowbtn .k{font:600 1.45rem/1.2 var(--f-kana);letter-spacing:.04em}
.rowbtn .s{font:700 .76rem var(--f-ui);color:var(--muted)}
.rowbtn .done{position:absolute;right:10px;top:9px;width:22px;height:22px;border-radius:50%;background:var(--c);color:var(--card);font:800 .8rem/22px var(--f-ui);text-align:center}
.rowbtn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.kc{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start;border:1.5px solid;border-radius:var(--r);padding:12px}
.kc .big{width:96px;height:96px;background:var(--card);border-radius:12px;padding:6px;cursor:pointer;border:0}
.kc .big .kvg{width:100%;height:100%}
.kc .big .kvg path{stroke-width:4.2}
.kc .r{font:800 1.4rem/1.1 var(--f-ui)}
.kc .m{font-size:.88rem;color:var(--muted);margin:2px 0 8px}
.steps{display:flex;gap:6px;margin:6px 0 12px}
.steps span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.steps span.on{background:var(--c)}
.rule{display:flex;flex-direction:column;gap:6px}
.rule .ex{display:flex;gap:6px;flex-wrap:wrap}
.rule .ex span{border:1.5px solid;border-radius:10px;padding:3px 9px;font:700 .86rem var(--f-ui)}
.rule .ex span b{font:600 1.15rem var(--f-kana);margin-right:6px}

/* table */
.tstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:330px;margin:0 auto 10px}
.cell{aspect-ratio:1/1;border:1.5px solid var(--line);border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;font:700 .7rem var(--f-ui);color:var(--muted)}
.cell img{width:100%;height:100%;object-fit:contain}
.cell.cur{border:2.5px solid var(--c)!important}
.cell.void{background:transparent;border-style:dashed;opacity:.45}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
button.cell{cursor:pointer;padding:0;font:inherit;color:inherit}
.grid .cell .ck{position:absolute;right:4px;top:1px;font:600 1rem var(--f-kana)}
.grid .cell .rr{position:absolute;left:5px;bottom:2px;font:700 .64rem var(--f-ui);color:var(--muted)}
.grid .cell.x{background:var(--bad-soft)!important;border:2.5px solid var(--bad)!important}
.grid .cell.x .ck{color:var(--bad)}

/* plan */
.hero{position:relative;overflow:hidden}
.conds{display:flex;flex-direction:column;gap:6px;margin:4px 0 0;padding:0;list-style:none}
.conds li{display:flex;gap:10px;align-items:center;font-size:.9rem}
.conds li i{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line)}
.conds li.ok i{background:var(--ok);border-color:var(--ok)}
.conds li span b{font-variant-numeric:tabular-nums}
.hanko{position:absolute;right:14px;top:12px;width:74px;height:74px;border:3px solid var(--shu);border-radius:50%;color:var(--shu);display:flex;align-items:center;justify-content:center;font:600 1.5rem/1 var(--f-kana);transform:rotate(-12deg);letter-spacing:.05em;opacity:.9}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.map div{aspect-ratio:1.5/1;border-radius:8px;display:flex;align-items:center;justify-content:center;font:600 1.05rem var(--f-kana);color:color-mix(in oklab,var(--c) 85%,var(--ink))}
.map div.void{background:transparent}
.legend{display:flex;align-items:center;gap:6px;font-size:.76rem;color:var(--muted);margin-top:8px}
.legend i{width:16px;height:12px;border-radius:4px;background:color-mix(in oklab,var(--r-h) var(--p),var(--card))}
.blocks{display:flex;flex-direction:column;gap:6px}
.blk{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px}
.blk .t{font:800 .78rem/1.35 var(--f-ui);font-variant-numeric:tabular-nums;color:color-mix(in oklab,var(--c) 85%,var(--ink));background:color-mix(in oklab,var(--c) 13%,var(--card));border-radius:10px;padding:6px 4px;text-align:center}
.blk .d{font-size:.9rem;min-width:0}
.blk .d b{display:block;font-size:.95rem}
.blk.now{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in oklab,var(--c) 30%,transparent)}
.blk.past{opacity:.5}
.howto{display:flex;flex-direction:column;gap:12px}
.howto b{display:block}

/* review list */
.rl{display:flex;flex-direction:column;gap:6px}
.ri{display:grid;grid-template-columns:minmax(72px,auto) 1fr auto auto;gap:10px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;cursor:pointer;color:var(--ink);font:inherit;text-align:left}
.ri .rom{font:800 .95rem var(--f-ui)}
.ri .img{height:52px;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;min-width:0}
.ri .img img{height:100%;max-width:100%;object-fit:contain}
.ri .a{font:600 1.3rem var(--f-kana)}
.ri.x{background:var(--bad-soft);border-color:var(--bad)}
.ri.w{background:var(--warn-soft);border-color:var(--warn)}
.confirm{border:1.5px solid var(--bad);background:var(--bad-soft);border-radius:12px;padding:10px}
.trio{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.trio div{border:1.5px solid;border-radius:12px;padding:4px 10px;text-align:center}
.trio div b{display:block;font:600 1.8rem/1.2 var(--f-kana)}
.trio div span{font:800 .74rem var(--f-ui);color:var(--muted)}
.score{font:800 2.6rem/1.1 var(--f-ui);font-variant-numeric:tabular-nums}
.credit{font-size:.74rem;color:var(--muted);margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.kvg.anim path,.pad .hm path{animation:none;opacity:1;stroke-dashoffset:0}}
.prompt .en{font:700 .95rem var(--f-ui);color:var(--muted);margin-top:2px}
.romsub{font:800 .95rem var(--f-ui);color:var(--muted)}
.romsub span{font-weight:500;margin-left:8px}
.twin{font:700 .74rem var(--f-ui);color:var(--muted);margin-left:6px;white-space:nowrap}
.twin .kana{font-size:1rem;color:var(--ink)}
.howto .kana{font-size:1.05rem}
html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.wrap{padding-top:calc(12px + env(safe-area-inset-top,0px))}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo"><h1><span style="--c:var(--r-k)">カ</span><span style="--c:var(--r-t)">タ</span><span style="--c:var(--r-k)">カ</span><span style="--c:var(--r-n)">ナ</span></h1><small>4 JAM</small></div>
    <div class="clock" id="clock"></div>
  </header>
  <div class="spectrum" id="spectrum" aria-hidden="true"></div>
  <section class="panel" id="p-plan"></section>
  <section class="panel" id="p-learn" hidden></section>
  <section class="panel" id="p-drill" hidden></section>
  <section class="panel" id="p-table" hidden></section>
  <section class="panel" id="p-test" hidden></section>
</div>

<nav class="tabs" aria-label="Menu utama"><div class="in" role="tablist">
  <button role="tab" data-tab="plan" aria-selected="true" style="--c:var(--r-h)"><span class="g">時</span>Rencana</button>
  <button role="tab" data-tab="learn" aria-selected="false" style="--c:var(--r-a)"><span class="g">ア</span>Belajar</button>
  <button role="tab" data-tab="drill" aria-selected="false" style="--c:var(--r-t)"><span class="g">練</span>Latih</button>
  <button role="tab" data-tab="table" aria-selected="false" style="--c:var(--r-y)"><span class="g">表</span>Tabel</button>
  <button role="tab" data-tab="test" aria-selected="false" style="--c:var(--r-k)"><span class="g">試</span>Tes</button>
</div></nav>

<script>
(function(){

/* ---------- KAKIJUN (stroke order) ---------- */
const CELL=109;
function kanaSVG(str,o={}){
  let x=0,k=0,body='';
  for(const ch of str){const d=KVG[ch];if(!d){x+=CELL;continue}
    d.p.forEach((p,j)=>{if(o.upto!=null&&j>o.upto)return;const cls=o.hl!=null?(j===o.hl?'':'done'):'';
      body+=`<path d="${p}" pathLength="1"${x?` transform="translate(${x} 0)"`:''}${cls?` class="${cls}"`:''}${o.anim?` style="animation-delay:${(k*0.45).toFixed(2)}s"`:''}/>`;k++});
    if(o.nums)d.n.forEach((n,j)=>{body+=`<g class="num" transform="translate(${x+n[0]+2.6} ${n[1]-2.6})"><circle r="5"/><text>${j+1}</text></g>`});
    x+=CELL}
  return`<svg class="kvg${o.anim?' anim':''}" viewBox="0 0 ${x||CELL} ${CELL}" aria-hidden="true">${body}</svg>`;
}
function kakijunStrip(ch){const d=KVG[ch];if(!d)return'';return`<div class="strip" aria-label="Urutan goresan ${d.p.length} langkah">${d.p.map((_,j)=>`<div class="bx"><b>${j+1}</b>${kanaSVG(ch,{upto:j,hl:j})}</div>`).join('')}</div>`}
const HANAMARU=(()=>{const P=[],cx=50,cy=50;
  for(let t=0;t<=1.0001;t+=0.012){const a=-1.2+t*2.3*2*Math.PI,r=7+23*t;P.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}
  const a0=-1.2+2.3*2*Math.PI;for(let t=0;t<=1.0001;t+=0.004){const a=a0+t*2*Math.PI*1.04,r=35+9*Math.abs(Math.sin(t*Math.PI*8));P.push([cx+r*Math.cos(a),cy+r*Math.sin(a)])}
  return'M'+P.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join('L')})();

/* ---------- PAD ---------- */
function Pad(el,opt={}){
  el.className='pad'+(opt.wide?' wide':'');
  el.style.setProperty('--c',col(opt.row));
  el.innerHTML='<div class="ghost" aria-hidden="true"></div><canvas aria-label="Area menulis"></canvas>';
  const cv=el.querySelector('canvas'),gh=el.querySelector('.ghost'),ctx=cv.getContext('2d');
  let strokes=[],cur=null,w=0,h=0,dpr=1,t0=0;
  const ink=()=>getComputedStyle(document.documentElement).getPropertyValue('--ink').trim()||'#111';
  function style(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=ctx.fillStyle=ink();ctx.lineWidth=Math.max(3,Math.min(w,h)/24)}
  function seg(s,i){ctx.beginPath();ctx.moveTo(s[i-1][0]*w,s[i-1][1]*h);ctx.lineTo(s[i][0]*w,s[i][1]*h);ctx.stroke()}
  function dot(p){ctx.beginPath();ctx.arc(p[0]*w,p[1]*h,ctx.lineWidth/2,0,Math.PI*2);ctx.fill()}
  function redraw(){style();ctx.clearRect(0,0,w,h);for(const s of strokes){dot(s[0]);for(let i=1;i<s.length;i++)seg(s,i)}}
  function size(){const r=el.getBoundingClientRect();if(!r.width)return;dpr=window.devicePixelRatio||1;w=r.width;h=r.height;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);redraw()}
  const pt=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,Math.round(performance.now()-t0)]};
  cv.addEventListener('pointerdown',e=>{if(opt.locked&&opt.locked())return;e.preventDefault();cv.setPointerCapture(e.pointerId);style();if(!strokes.length)t0=performance.now();cur=[pt(e)];strokes.push(cur);dot(cur[0])});
  cv.addEventListener('pointermove',e=>{if(!cur)return;e.preventDefault();const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];for(const ev of evs){cur.push(pt(ev));seg(cur,cur.length-1)}});
  const end=()=>{if(cur){cur=null}};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
  const ro=new ResizeObserver(size);ro.observe(el);
  return{
    clear(){strokes=[];redraw();this.hideGhost();el.classList.remove('correct','wrong');const m=el.querySelector('.hm');if(m)m.remove()},
    undo(){strokes.pop();redraw()},
    empty(){return strokes.length===0},
    showGhost(t,o={}){gh.innerHTML=kanaSVG(t,o);gh.classList.add('show')},
    hideGhost(){gh.classList.remove('show')},
    mark(ok){el.classList.remove('correct','wrong');if(ok!=null)el.classList.add(ok?'correct':'wrong')},
    hanamaru(){if(el.querySelector('.hm'))return;el.insertAdjacentHTML('beforeend',`<svg class="hm" viewBox="0 0 100 100" aria-hidden="true"><path d="${HANAMARU}" pathLength="1"/></svg>`)},
    image(){return strokes.length?cv.toDataURL('image/png'):null},
    ink(){if(!strokes.length||!w)return null;return{w:Math.round(w),h:Math.round(h),ink:strokes.map(s=>[s.map(p=>Math.round(p[0]*w)),s.map(p=>Math.round(p[1]*h)),s.map(p=>p[2])])}},
    destroy(){ro.disconnect()}
  };
}

/* ---------- AUTO GRADING ----------
   Handwriting is read by Google's handwriting recognizer. Katakana shares shapes with some kanji and symbols
   (力 カ, 口 ロ, 一 ー), so readings are normalised to katakana before comparing. */
const REC_URL='https://inputtools.google.com/request?ime=handwriting&app=mobilesearch&cs=1&oe=UTF-8';
const AUTO={offUntil:0};
const autoReady=()=>Date.now()>=AUTO.offUntil;
async function recognize(ink){
  if(!ink||!autoReady())return null;
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),7000);
  try{
    const r=await fetch(REC_URL,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl.signal,
      body:JSON.stringify({options:'enable_pre_space',requests:[{writing_guide:{writing_area_width:ink.w,writing_area_height:ink.h},ink:ink.ink,language:'ja',max_num_results:10,max_completions:0}]})});
    const j=await r.json();if(j[0]!=='SUCCESS')throw new Error('rec');return j[1][0][1]||[];
  }catch(e){AUTO.offUntil=Date.now()+60000;return null}finally{clearTimeout(tm)}
}
const NORM={'一':'ー','—':'ー','－':'ー','ｰ':'ー','‐':'ー','-':'ー','―':'ー','─':'ー','力':'カ','工':'エ','口':'ロ','二':'ニ','八':'ハ','夕':'タ','卜':'ト','匕':'ヒ','才':'オ','〆':'メ','千':'チ','へ':'ヘ','べ':'ベ','ぺ':'ペ','り':'リ'};
const norm=s=>[...s].map(c=>NORM[c]||c).join('');
const KATA=/^[ァ-ヺー]+$/;
const big=s=>[...s].map(c=>SMALL[c]||c).join('');
function verdict(target,cands){
  const top=cands.map(norm).filter(c=>KATA.test(c))[0]||'';
  if(top===target)return{v:'ok',read:top};
  if(top&&big(top)===big(target))return{v:[...target].length===1?'ok':'check',read:top};
  return{v:'bad',read:top||cands[0]||''};
}
async function judgeMany(list,onEach){let i=0;const run=async()=>{while(i<list.length){const it=list[i++];const c=await recognize(it.ink);onEach(it,c?verdict(it.k,c):null)}};await Promise.all([run(),run(),run(),run(),run(),run()])}
async function judge(P,pad,it,extra,finish,keys){
  let done=false;const end=ok=>{if(done)return;done=true;finish(ok)};
  pad.showGhost(it.k,{anim:true});$('#tl',P).style.visibility='hidden';
  const rv=$('#rv',P),ac=$('#ac',P);
  const info=`<div class="ans cink" style="--c:${col(it.row)}">${it.k}</div><div class="romsub">${esc(R(it))}${it.en?`<span>${esc(it.en)}</span>`:''}</div>${extra||''}`;
  let a=null;
  if(pad.empty())a={v:'bad',read:''};
  else if(autoReady()){rv.innerHTML=info+'<div class="verdict">Menilai tulisan Anda</div>';ac.innerHTML='<button class="btn" disabled>Menilai</button>';
    const c=await recognize(pad.ink());if(c)a=verdict(it.k,c)}
  if(!rv.isConnected)return;
  if(!a||a.v==='check'){
    rv.innerHTML=info+(a?'<div class="verdict"><span class="pill warn">Periksa</span>Bentuknya benar. Pastikan huruf kecilnya memang ditulis kecil.</div>':'');
    ac.innerHTML='<button class="btn bad" id="no">Salah</button><button class="btn ok" id="yes">Benar</button>';
    $('#no',P).onclick=()=>end(false);$('#yes',P).onclick=()=>end(true);
    keys.check=null;keys.yes=()=>end(true);keys.no=()=>end(false);return}
  let ok=a.v==='ok';
  const paint=()=>{pad.mark(ok);if(ok)pad.hanamaru();else{const m=P.querySelector('.hm');if(m)m.remove()}
    rv.innerHTML=info+`<div class="verdict">${ok?'<span class="pill ok">Benar</span>':`<span class="pill bad">Salah</span>${a.read?`Terbaca sebagai <span class="kana">${esc(a.read)}</span>`:'Tulisan tidak terbaca'}`}</div>`;
    ac.innerHTML=`<button class="btn ghost" id="ov">${ok?'Tandai salah':'Sebenarnya benar'}</button><button class="btn pri" id="nx">Lanjut</button>`;
    $('#ov',P).onclick=()=>{ok=!ok;paint()};$('#nx',P).onclick=()=>end(ok);$('#nx',P).focus({preventScroll:true})};
  paint();keys.check=()=>end(ok);keys.yes=()=>end(true);keys.no=()=>end(false);
}

  document.querySelectorAll('.panel').forEach(p=>p.hidden=p.id!=='p-'+tab);RENDER[tab]();spectrum();window.scrollTo(0,0)}
document.querySelectorAll('nav.tabs button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));
function spectrum(){$('#spectrum').innerHTML=ROWS.map(r=>`<i class="${S.learned[r.id]?'on':''}" style="--c:var(--r-${r.id})"></i>`).join('')}

/* ---------- CLOCK ---------- */
function tick(){const c=$('#clock');if(!S.start){c.innerHTML='Sesi belum dimulai';return}
  const el=(Date.now()-S.start)/1000,rem=4*3600-el;c.innerHTML=rem>0?'Sisa <b>'+fmt(rem)+'</b>':'<b>Waktu habis</b>';
  if(TAB==='plan'){const m=el/60;document.querySelectorAll('.blk').forEach((b,i)=>{b.classList.toggle('now',m>=PLAN[i].s&&m<PLAN[i].e);b.classList.toggle('past',m>=PLAN[i].e)})}}
setInterval(tick,1000);

/* ---------- PLAN ---------- */
const GRID=[];ROWS.forEach(r=>{if(r.id==='w'){const row=[null,null,null,null,null];r.items.forEach(i=>{if(i[2]!=null)row[i[2]]=i[0]});GRID.push(row);GRID.push(['ン',null,null,null,null])}else{const row=[null,null,null,null,null];r.items.forEach(i=>row[i[2]]=i[0]);GRID.push(row)}});
const ORDER=GRID.flat().filter(Boolean);
let resetAsk=false;
function renderPlan(){const P=$('#p-plan');
  const rowsDone=ROWS.filter(r=>S.learned[r.id]).length;
  const bestX=S.tests.length?Math.max(...S.tests.map(t=>Math.round(100*t.score/t.total))):null;
  const c1=rowsDone===10,c2=S.streak>=2,c3=bestX!==null&&bestX>=90,ready=c1&&c2&&c3;
  const mix=b=>[6,22,38,55,72,88][b];
  const wordsStrong=WORDS.filter(w=>card(w.k).b>=2).length;
  P.innerHTML=installCard()+`
  <div class="card hero stack">
    ${ready?'<div class="hanko" aria-label="Lulus">合格</div>':''}
    <h3 style="max-width:70%">Menulis katakana dari romaji</h3>
    <ul class="conds">
      <li class="${c1?'ok':''}"><i></i><span>Semua baris dipelajari, <b>${rowsDone}</b> dari 10</span></li>
      <li class="${c2?'ok':''}"><i></i><span>Tabel Kosong sempurna dua kali berturut-turut, <b>${Math.min(S.streak,2)}</b> dari 2</span></li>
      <li class="${c3?'ok':''}"><i></i><span>Simulasi tes minimal 90 persen${bestX!==null?`, terbaik <b>${bestX}%</b>`:''}</span></li>
    </ul>
    <div class="row">${S.start?'<button class="btn sm" id="restart">Mulai ulang waktu</button>':'<button class="btn pri grow" id="startS">Mulai sesi 4 jam</button>'}</div>
  </div>
  <h2>Peta ingatan</h2>
  <div class="card">
    <div class="map">${GRID.flat().map(k=>k?`<div style="--c:var(--r-${ROW_OF[k]});background:color-mix(in oklab,var(--c) ${mix(card(k).b)}%,var(--card))">${k}</div>`:'<div class="void"></div>').join('')}</div>
    <div class="legend"><span>Lemah</span>${[6,30,55,88].map(p=>`<i style="--p:${p}%"></i>`).join('')}<span>Kuat</span><span style="margin-left:auto">Kata serapan dikuasai: <b>${wordsStrong}</b> dari ${WORDS.length}</span></div>
  </div>
  <h2>Jadwal 4 jam</h2>
  <div class="blocks">${PLAN.map(b=>`<div class="blk" style="--c:var(--r-${b.c})"><div class="t">${hhmm(b.s)}<br>${hhmm(b.e)}</div><div class="d"><b>${esc(b.t)}</b><span class="muted">${esc(b.d)}</span></div>${b.go?`<button class="btn sm" data-go="${b.go}">Buka</button>`:'<span></span>'}</div>`).join('')}</div>
  <h2>Cara berlatih</h2>
  <div class="card howto small">
    <div><b>Manfaatkan hiragana yang sudah Anda kuasai.</b>Sebagian katakana hampir sama dengan pasangan hiragananya: <span class="kana">か カ, き キ, へ ヘ, り リ, せ セ, も モ, や ヤ</span>. Huruf-huruf ini cepat selesai. Curahkan waktu pada yang berbeda.</div>
    <div><b>Tulis dulu, baru periksa.</b>Melihat jawaban sebelum menulis hanya melatih kemampuan mengenali. Tes menuntut Anda menulis.</div>
    <div><b>Vokal ganda di romaji berarti ー.</b>Dalam kata serapan, aa, ii, uu, ee, dan oo hampir selalu ditulis dengan garis panjang: koohii menjadi コーヒー.</div>
    <div><b>Penilaian otomatis, keputusan tetap di tangan Anda.</b>Tulisan dibaca oleh pengenal tulisan tangan Google. Jika penilaiannya keliru, ubah saja.</div>
  </div>
  <h2>Pengaturan</h2>
  <div class="card stack small">
    <div><b>Penulisan vokal panjang pada romaji</b><br><span class="muted">Ikuti cara yang dipakai di tes Anda.</span></div>
    <div class="chips" role="group" aria-label="Penulisan vokal panjang"><button class="chip" aria-pressed="${!S.macron}" data-mac="0">koohii</button><button class="chip" aria-pressed="${!!S.macron}" data-mac="1">kōhī</button></div>
    <p class="muted" style="margin:0">Progres hanya tersimpan di browser ini.</p>
    ${resetAsk?`<div class="confirm stack"><b>Hapus semua progres?</b><div class="row"><button class="btn bad" id="rsYes">Hapus</button><button class="btn" id="rsNo">Batal</button></div></div>`:'<div><button class="btn sm" id="rs">Reset progres</button></div>'}
  </div>
  <p class="credit">Dikembangkan oleh <b>@noeroelama</b>.<br>Data urutan goresan dari KanjiVG oleh Ulrich Apel, lisensi CC BY-SA 3.0.</p>`;
  P.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
  P.querySelectorAll('[data-mac]').forEach(b=>b.onclick=()=>{S.macron=b.dataset.mac==='1';save();renderPlan()});
  const ins=$('#inst',P);if(ins)ins.onclick=async()=>{const e=installEvt;installEvt=null;try{await e.prompt()}catch(_){}renderPlan()};
  const s1=$('#startS',P);if(s1)s1.onclick=()=>{S.start=Date.now();save();renderPlan();tick()};
  const s2=$('#restart',P);if(s2)s2.onclick=()=>{S.start=Date.now();save();tick()};
  const r=$('#rs',P);if(r)r.onclick=()=>{resetAsk=true;renderPlan()};
  const ry=$('#rsYes',P);if(ry)ry.onclick=()=>{S={cards:{},learned:{},tables:[],tests:[],start:null,streak:0,macron:S.macron};save();resetAsk=false;renderPlan();spectrum();tick()};
  const rn=$('#rsNo',P);if(rn)rn.onclick=()=>{resetAsk=false;renderPlan()};
  tick();
}

/* ---------- LEARN ---------- */
let L=null;
function renderLearn(){killPads('learn');const P=$('#p-learn');
  if(!L){
    const next=ROWS.find(r=>!S.learned[r.id]);
    P.innerHTML=`
    <p class="muted small">Setiap baris punya warnanya sendiri, sama seperti di aplikasi hiragana. Tiap baris melewati tiga tahap: mengenali bentuk dan urutan goresan, menjiplak, lalu menulis dari ingatan sampai semuanya benar.</p>
    ${next?`<button class="btn pri" style="width:100%;margin-bottom:12px" data-row="${next.id}">Pelajari ${next.name}&nbsp;<span class="kana">${next.items.map(i=>i[0]).join(' ')}</span></button>`:'<div class="card small" style="margin-bottom:12px"><b>Semua baris sudah selesai.</b> Lanjutkan dengan aturan katakana di bawah, lalu kata serapan.</div>'}
    <div class="rowlist">${ROWS.map(r=>`<button class="rowbtn tint" style="--c:var(--r-${r.id})" data-row="${r.id}"><span class="k cink">${r.items.map(i=>i[0]).join('')}</span><span class="s">${r.name}</span>${S.learned[r.id]?'<span class="done" aria-label="selesai">✓</span>':''}</button>`).join('')}</div>
    <h2>Aturan katakana</h2>
    <p class="muted small">Pelajari setelah 46 huruf dasar dikuasai. Inilah bagian yang membedakan nilai tes katakana.</p>
    <div class="stack">${RULES.map(r=>`<div class="card rule"><h3>${esc(r.t)}</h3><p class="muted small" style="margin:0">${esc(r.d)}</p><div class="ex">${r.ex.map(k=>{const it=BY[k];const rw=rowOf(k);return`<span class="tint" style="--c:${col(rw)}"><b class="cink">${k}</b>${esc(it?R(it):k2r(k,S.macron))}</span>`}).join('')}</div><div><button class="btn sm" data-set="${r.set}">Latih set ini</button></div></div>`).join('')}</div>`;
    P.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{L={row:ROWS.find(r=>r.id===b.dataset.row),step:'intro'};renderLearn();window.scrollTo(0,0)});
    P.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{DR.mode=b.dataset.set;DR.only=null;DR.q=null;show('drill')});
    return;
  }
  const Rw=L.row,items=Rw.items.map(i=>BY[i[0]]),C=`var(--r-${Rw.id})`;
  const stepIx={intro:0,trace:1,recall:2,done:3}[L.step];
  const head=`<div class="row" style="justify-content:space-between"><button class="btn sm ghost" id="back">Semua baris</button><span class="pill tint cink" style="--c:${C}">${Rw.name}</span></div><div class="steps" style="--c:${C}">${[0,1,2].map(i=>`<span class="${i<=stepIx?'on':''}"></span>`).join('')}</div>`;
  if(L.step==='intro'){
    P.innerHTML=head+`<h2 style="margin-top:0">Kenali bentuk dan urutan goresannya</h2><p class="muted small">Ketuk huruf besar untuk memutar ulang urutan goresan. Hiragana pasangannya ditampilkan sebagai jembatan ingatan.</p>
    <div class="stack">${items.map(it=>`<div class="kc tint" style="--c:${C}"><button class="big cink" data-play="${it.k}" aria-label="Putar urutan goresan ${it.r}">${kanaSVG(it.k,{anim:true})}</button><div style="min-width:0"><div class="r cink">${it.r} <span class="twin">hiragana <span class="kana">${twin(it.k)}</span></span></div><div class="m">${esc(it.m)}</div><div class="cink">${kakijunStrip(it.k)}</div></div></div>`).join('')}</div>
    <button class="btn pri" style="width:100%;margin-top:12px" id="go">Mulai menjiplak</button>`;
    P.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>{b.innerHTML=kanaSVG(b.dataset.play,{anim:true})});
    $('#go',P).onclick=()=>{L.step='trace';L.i=0;renderLearn()};
  }else if(L.step==='trace'){
    const it=items[L.i];
    P.innerHTML=head+`<div class="meta"><span>Jiplak sesuai nomor goresan</span><span><b>${L.i+1}</b> dari ${items.length}</span></div>
    <div class="prompt"><div class="rom cink" style="--c:${C}">${it.r}</div></div>
    <div id="pad"></div>
    <div class="tools"><button class="btn sm" id="pl">Putar urutan</button><button class="btn sm" id="un">Urungkan</button><button class="btn sm" id="cl">Hapus</button></div>
    <div class="actions"><button class="btn pri" id="nx">${L.i<items.length-1?'Huruf berikutnya':'Tulis dari ingatan'}</button></div>`;
    const pad=addPad('learn',$('#pad',P),{row:Rw.id});pad.showGhost(it.k,{nums:true});
    $('#pl',P).onclick=()=>pad.showGhost(it.k,{anim:true,nums:true});
    $('#un',P).onclick=()=>pad.undo();$('#cl',P).onclick=()=>{pad.clear();pad.showGhost(it.k,{nums:true})};
    $('#nx',P).onclick=()=>{if(L.i<items.length-1){L.i++}else{L.step='recall';L.order=shuffle(items.map(x=>x.k))}renderLearn()};
  }else if(L.step==='recall'){
    const it=BY[L.order[0]];
    P.innerHTML=head+`<div class="meta"><span>Tulis dari ingatan</span><span><b>${L.order.length}</b> tersisa</span></div>
    <div class="prompt"><div class="lbl">Tulis katakana untuk</div><div class="rom cink" style="--c:${C}">${it.r}</div></div>
    <div id="pad"></div><div class="reveal" id="rv"></div>
    <div class="tools" id="tl"><button class="btn sm" id="un">Urungkan</button><button class="btn sm" id="cl">Hapus</button></div>
    <div class="actions" id="ac"><button class="btn pri" id="ck">Periksa</button></div>`;
    let revealed=false;
    const pad=addPad('learn',$('#pad',P),{row:Rw.id,locked:()=>revealed});
    $('#un',P).onclick=()=>pad.undo();$('#cl',P).onclick=()=>pad.clear();
    const fin=ok=>{grade(it.k,ok);L.order.shift();if(!ok)L.order.splice(Math.min(2,L.order.length),0,it.k);
      if(!L.order.length){S.learned[Rw.id]=true;save();L.step='done'}setTimeout(renderLearn,120)};
    const keys={};L.keys=keys;
    keys.check=()=>{if(revealed)return;revealed=true;judge(P,pad,it,`<div class="mn">${esc(it.m)}</div>`,fin,keys)};
    $('#ck',P).onclick=keys.check;
  }else{
    const ix=ROWS.indexOf(Rw),nx=ROWS[ix+1],mix=(ix+1)%3===0;
    P.innerHTML=head+`<div class="card tint stack" style="--c:${C};text-align:center"><div class="kana cink" style="font-size:2.8rem">${items.map(i=>i.k).join(' ')}</div><h3>${Rw.name} selesai dan masuk ke daftar latihan.</h3>
    <p class="muted small" style="margin:0">${mix?'Tiga baris sudah selesai. Kerjakan latihan campuran lima menit sebelum lanjut.':'Lanjutkan ke baris berikutnya selagi bentuknya masih segar.'}</p>
    <div class="row" style="justify-content:center">${nx?`<button class="btn ${mix?'':'pri'}" id="nr">Baris berikutnya</button>`:''}<button class="btn ${mix||!nx?'pri':''}" id="dr">Latihan campuran</button></div></div>`;
    if(nx)$('#nr',P).onclick=()=>{L={row:nx,step:'intro'};renderLearn();window.scrollTo(0,0)};
    $('#dr',P).onclick=()=>{L=null;DR.mode='base';DR.only=null;DR.q=null;show('drill')};
    spectrum();
  }
  $('#back',P).onclick=()=>{L=null;renderLearn()};
}

/* ---------- DRILL ---------- */
const MODES=[['base','Huruf dasar'],['pairs','Pasangan mirip'],['daku','Dakuten'],['combo','ャ ュ ョ'],['foreign','Bunyi asing'],['word','Kata serapan'],['all','Campuran'],['weak','Yang salah']];
const DR={mode:'base',q:null,stat:{c:0,w:0},only:null};
function poolFor(mode){
  const learnedBase=BASE.filter(i=>S.learned[i.row]);
  switch(mode){
    case 'base':return learnedBase.length?learnedBase:BASE.filter(i=>i.row==='a');
    case 'pairs':return [...new Set(PAIRS.flat())].map(k=>BY[k]);
    case 'daku':return DAKU;case 'combo':return COMBO;case 'foreign':return FOREIGN;case 'word':return WORDS;
    case 'all':return [...BASE,...DAKU,...COMBO,...FOREIGN,...WORDS];
    case 'weak':{if(DR.only)return DR.only.map(k=>BY[k]).filter(Boolean);return Object.entries(S.cards).filter(([k,c])=>c.w>0&&c.b<2&&BY[k]).map(([k])=>BY[k])}
  }return BASE}
function buildQ(items){const by=[0,1,2,3,4,5].map(b=>shuffle(items.filter(i=>card(i.k).b===b)));return by.flat()}
function renderDrill(){killPads('drill');const P=$('#p-drill');
  if(!DR.q){DR.q=buildQ(poolFor(DR.mode));DR.stat={c:0,w:0}}
  const learnedN=Object.keys(S.learned).length;
  const chips=`<div class="chips" role="group" aria-label="Pilih set">${MODES.map(([m,l])=>`<button class="chip" aria-pressed="${DR.mode===m}" data-m="${m}">${l}</button>`).join('')}</div>`;
  if(!DR.q.length){P.innerHTML=chips+`<div class="card" style="margin-top:12px"><b>${DR.mode==='weak'?'Belum ada huruf yang ditandai salah.':'Set ini kosong.'}</b><p class="muted small" style="margin:4px 0 0">Setiap huruf atau kata yang Anda tandai salah, dari tab mana pun, akan terkumpul di sini.</p></div>`;bindChips(P);return}
  const it=DR.q[0],c=card(it.k),C=col(it.row),rom=R(it);
  const group=DR.mode==='pairs'?PAIRS.find(g=>g.includes(it.k)):null;
  const note=DR.mode==='base'&&!learnedN?'<p class="muted small" style="margin:8px 0 0">Belum ada baris yang selesai dipelajari, jadi latihan memakai baris A.</p>':'';
  P.innerHTML=chips+note+`
  <div class="meta" style="margin-top:12px"><span>Benar <b style="color:var(--ok)">${DR.stat.c}</b>&ensp;Salah <b style="color:var(--bad)">${DR.stat.w}</b></span><span>Tingkat <b>${c.b}</b> dari 5</span></div>
  <div class="prompt"><div class="lbl">Tulis katakana untuk</div><div class="rom cink ${rom.length>9?'long':''}" style="--c:${C}">${esc(rom)}</div>${it.en?`<div class="en">${esc(it.en)}</div>`:''}</div>
  <div id="pad"></div><div class="reveal" id="rv"></div>
  <div class="tools" id="tl"><button class="btn sm" id="un">Urungkan</button><button class="btn sm" id="cl">Hapus</button></div>
  <div class="actions" id="ac"><button class="btn pri" id="ck">Periksa</button></div>
  <div class="kbd">Dengan keyboard, Enter untuk memeriksa dan lanjut. Panah kiri dan kanan untuk menandai salah atau benar.</div>`;
  bindChips(P);
  let revealed=false;
  const pad=addPad('drill',$('#pad',P),{wide:isWide(it),row:it.row,locked:()=>revealed});
  $('#un',P).onclick=()=>pad.undo();$('#cl',P).onclick=()=>pad.clear();
  const extra=`${it.m?`<div class="mn">${esc(it.m)}</div>`:''}${group?`<div class="trio">${group.map(k=>`<div class="tint" style="--c:var(--r-${ROW_OF[k]})"><b class="cink">${k}</b><span>${BY[k].r}</span></div>`).join('')}</div>`:''}`;
  const fin=ok=>{grade(it.k,ok);ok?DR.stat.c++:DR.stat.w++;
    DR.q.shift();
    if(!(DR.mode==='weak'&&ok&&card(it.k).b>=2)){const gap=ok?[4,8,15,30,60][card(it.k).b-1]:3;DR.q.splice(Math.min(gap,DR.q.length),0,it)}
    setTimeout(renderDrill,120)};
  const keys={};DR.keys=keys;
  keys.check=()=>{if(revealed)return;revealed=true;judge(P,pad,it,extra,fin,keys)};
  $('#ck',P).onclick=keys.check;
}
function bindChips(P){P.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{DR.mode=b.dataset.m;DR.only=null;DR.q=null;renderDrill()})}

/* ---------- TABLE (Tabel Kosong) ---------- */
let TB=null;
function renderTable(){killPads('table');const P=$('#p-table');
  if(!TB){
    const last=S.tables.slice(-3).reverse();
    P.innerHTML=`<div class="card stack">
      <h3>Tabel Kosong</h3>
      <p class="small" style="margin:0">Tulis ke-46 katakana secara berurutan, baris demi baris, tanpa melihat apa pun. Warna kotak menunjukkan baris yang sedang Anda isi. Lewati huruf yang tidak Anda ingat. Penilaian dilakukan setelah tabel selesai.</p>
      <p class="muted small" style="margin:0">Ulangi sampai sempurna dua kali berturut-turut. Saat ini ${S.streak} dari 2.</p>
      <button class="btn pri" id="go">Mulai</button></div>
      ${last.length?`<h2>Percobaan terakhir</h2><div class="stack">${last.map(t=>`<div class="card meta"><span><b>${t.score}</b> dari 46 benar, ${fmt(t.time)}</span><span>${at(t.at)}</span></div>`).join('')}</div>`:''}
      <p class="muted small" style="margin-top:14px">Versi kertas sama efektifnya. Gambar tabel lima kolom dan sebelas baris, isi dari ingatan, lalu cocokkan dengan Peta ingatan di tab Rencana.</p>`;
    $('#go',P).onclick=()=>{TB={i:0,img:{},ink:{},start:Date.now(),phase:'write',x:{},touched:{}};renderTable()};return}
  if(TB.phase==='write'){
    const k=ORDER[TB.i],it=BY[k];const rowIx=GRID.findIndex(r=>r.includes(k));const row=GRID[rowIx];const C=col(it.row);
    P.innerHTML=`<div class="meta"><span>Baris <b>${rowIx+1}</b> dari ${GRID.length}</span><span id="tt"></span></div>
    <div class="tstrip" style="margin-top:8px">${row.map(c=>c?`<div class="cell tint ${c===k?'cur':''}" style="--c:${C}">${TB.img[c]?`<img alt="" src="${TB.img[c]}">`:(c in TB.img?'kosong':'')}</div>`:'<div class="cell void"></div>').join('')}</div>
    <div class="prompt"><div class="rom cink" style="--c:${C}">${it.r}</div></div>
    <div id="pad"></div>
    <div class="tools"><button class="btn sm" id="un">Urungkan</button><button class="btn sm" id="cl">Hapus</button></div>
    <div class="actions"><button class="btn" id="sk">Lewati</button><button class="btn pri" id="nx">Lanjut</button></div>
    <div class="row" style="justify-content:center;margin-top:8px"><button class="btn sm ghost" id="ab">Batalkan percobaan</button></div>`;
    const pad=addPad('table',$('#pad',P),{row:it.row});
    const t=$('#tt',P);const upd=()=>{if(t.isConnected)t.innerHTML='Waktu <b>'+fmt((Date.now()-TB.start)/1000)+'</b>'};upd();clearInterval(TB.iv);TB.iv=setInterval(upd,1000);
    $('#un',P).onclick=()=>pad.undo();$('#cl',P).onclick=()=>pad.clear();
    const adv=(img,ink)=>{TB.img[k]=img;TB.ink[k]=ink;TB.i++;if(TB.i>=ORDER.length){TB.time=(Date.now()-TB.start)/1000;clearInterval(TB.iv);TB.phase='review';ORDER.forEach(q=>{if(!TB.img[q])TB.x[q]=true})}renderTable()};
    $('#sk',P).onclick=()=>adv(null,null);$('#nx',P).onclick=()=>adv(pad.image(),pad.ink());
    $('#ab',P).onclick=()=>{clearInterval(TB.iv);TB=null;renderTable()};
    TB.keys={check:()=>adv(pad.image(),pad.ink())};
  }else if(TB.phase==='review'){
    if(TB.auto===undefined){
      const list=ORDER.filter(k=>TB.ink[k]).map(k=>({k,ink:TB.ink[k]}));
      if(!list.length||!autoReady())TB.auto='manual';
      else{TB.auto='running';TB.prog=0;TB.fail=0;const T=TB;
        judgeMany(list,(it,a)=>{T.prog++;if(!a)T.fail++;else if(!T.touched[it.k])T.x[it.k]=a.v==='bad';const s=$('#autoStat');if(s)s.textContent=T.prog+' dari '+list.length})
          .then(()=>{T.auto=T.fail===list.length?'manual':'done';if(TB===T&&TAB==='table')renderTable()})}
    }
    const wrong=Object.keys(TB.x).filter(k=>TB.x[k]).length;
    const msg=TB.auto==='running'?`Menilai otomatis, <span id="autoStat">${TB.prog} dari ${ORDER.filter(k=>TB.ink[k]).length}</span>.`
      :TB.auto==='done'?'Kotak bergaris merah salah menurut penilaian otomatis. Jawaban yang benar tertera di pojok setiap kotak. Ketuk kotak mana pun untuk mengubah penilaian.'
      :'Jawaban yang benar tertera di pojok setiap kotak. Ketuk kotak yang salah atau bentuknya meragukan. Kotak kosong sudah dihitung salah.';
    P.innerHTML=`<div class="card stack"><h3>Nilai tabel Anda</h3><p class="small" style="margin:0">Waktu ${fmt(TB.time)}. ${msg}</p></div>
    <div class="grid" style="margin-top:10px">${GRID.flat().map(k=>k?`<button class="cell tint ${TB.x[k]?'x':''}" style="--c:var(--r-${ROW_OF[k]})" data-k="${k}" aria-pressed="${!!TB.x[k]}" aria-label="${BY[k].r}">${TB.img[k]?`<img alt="" src="${TB.img[k]}">`:''}<span class="ck cink">${k}</span><span class="rr">${BY[k].r}</span></button>`:'<div class="cell void"></div>').join('')}</div>
    <div class="actions"><button class="btn pri" id="sv" ${TB.auto==='running'?'disabled':''}>Simpan hasil, ${46-wrong} dari 46 benar</button></div>`;
    P.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;TB.touched[k]=true;TB.x[k]=!TB.x[k];renderTable()});
    $('#sv',P).onclick=()=>{const miss=ORDER.filter(k=>TB.x[k]);const score=46-miss.length;
      ORDER.forEach(k=>grade(k,!TB.x[k]));
      S.tables.push({at:Date.now(),score,time:Math.round(TB.time)});S.streak=score===46?S.streak+1:0;save();
      TB.phase='result';TB.miss=miss;TB.score=score;renderTable()};
  }else{
    const m=TB.miss;
    P.innerHTML=`<div class="card stack" style="text-align:center">
      <div class="score">${TB.score}<span class="muted" style="font-size:1.1rem"> dari 46</span></div>
      <div class="muted small">Waktu ${fmt(TB.time)}. Sempurna berturut-turut ${S.streak} dari 2.</div>
      ${m.length?`<div class="kana" style="font-size:1.9rem;letter-spacing:.15em">${m.map(k=>`<span class="cink" style="--c:var(--r-${ROW_OF[k]})">${k}</span>`).join('')}</div><p class="small" style="margin:0">Tulis setiap huruf ini lima kali sambil mengucapkan romajinya, lalu latih di set Yang salah.</p>`:`<p class="small" style="margin:0">${S.streak>=2?'Sempurna dua kali berturut-turut. Huruf dasar sudah Anda kuasai. Fokuskan sisa waktu pada kata serapan.':'Sempurna. Ulangi sekali lagi untuk memastikan hasilnya konsisten.'}</p>`}
      <div class="row" style="justify-content:center">${m.length?'<button class="btn pri" id="dm">Latih yang salah</button>':''}<button class="btn ${m.length?'':'pri'}" id="ag">Ulangi tabel</button></div></div>`;
    if(m.length)$('#dm',P).onclick=()=>{DR.mode='weak';DR.only=m.slice();DR.q=null;TB=null;show('drill')};
    $('#ag',P).onclick=()=>{TB=null;renderTable()};
  }
}

/* ---------- TEST ---------- */
let TS=null;
function pick(arr,n){return shuffle(arr).slice(0,n)}
function renderTest(){killPads('test');const P=$('#p-test');
  if(!TS){const hist=S.tests.slice(-3).reverse();
    P.innerHTML=`<div class="card stack"><h3>Simulasi tes</h3>
      <p class="small" style="margin:0">Dua puluh soal: lima huruf dasar, tiga dakuten, dua kombinasi ャ ュ ョ, dua bunyi asing, dan delapan kata serapan. Romaji ditampilkan tanpa warna dan tanpa kata asalnya, seperti di kertas ujian. Jawaban baru ditampilkan setelah semua soal selesai.</p>
      <button class="btn pri" id="go">Mulai</button></div>
      ${hist.length?`<h2>Hasil terakhir</h2><div class="stack">${hist.map(t=>`<div class="card meta"><span><b>${t.score}</b> dari ${t.total} benar (${Math.round(100*t.score/t.total)}%), ${fmt(t.time)}</span><span>${at(t.at)}</span></div>`).join('')}</div>`:''}`;
    $('#go',P).onclick=()=>{const items=shuffle([...pick(BASE,5),...pick(DAKU,3),...pick(COMBO,2),...pick(FOREIGN,2),...pick(WORDS,8)]);TS={items,i:0,img:[],ink:[],start:Date.now(),phase:'write',x:{},w:{},touched:{}};renderTest()};return}
  if(TS.phase==='write'){const it=TS.items[TS.i],rom=R(it);
    P.innerHTML=`<div class="meta"><span>Soal <b>${TS.i+1}</b> dari 20</span><span id="tt"></span></div>
    <div class="steps" style="--c:var(--r-k);margin:6px 0 4px">${TS.items.map((_,i)=>`<span class="${i<TS.i?'on':''}"></span>`).join('')}</div>
    <div class="prompt" style="margin-top:8px"><div class="lbl">Tulis dalam katakana</div><div class="rom ${rom.length>9?'long':''}">${esc(rom)}</div></div>
    <div id="pad"></div>
    <div class="tools"><button class="btn sm" id="un">Urungkan</button><button class="btn sm" id="cl">Hapus</button></div>
    <div class="actions"><button class="btn" id="sk">Lewati</button><button class="btn pri" id="nx">${TS.i<19?'Berikutnya':'Selesai dan nilai'}</button></div>`;
    const pad=addPad('test',$('#pad',P),{wide:isWide(it)});
    const t=$('#tt',P);const upd=()=>{if(t.isConnected)t.innerHTML='Waktu <b>'+fmt((Date.now()-TS.start)/1000)+'</b>'};upd();clearInterval(TS.iv);TS.iv=setInterval(upd,1000);
    $('#un',P).onclick=()=>pad.undo();$('#cl',P).onclick=()=>pad.clear();
    const adv=(img,ink)=>{TS.img[TS.i]=img;TS.ink[TS.i]=ink;if(!img)TS.x[TS.i]=true;TS.i++;if(TS.i>=20){TS.time=(Date.now()-TS.start)/1000;clearInterval(TS.iv);TS.phase='review'}renderTest()};
    $('#sk',P).onclick=()=>adv(null,null);$('#nx',P).onclick=()=>adv(pad.image(),pad.ink());
    TS.keys={check:()=>adv(pad.image(),pad.ink())};
  }else if(TS.phase==='review'){
    if(TS.auto===undefined){
      const list=TS.items.map((it,i)=>({k:it.k,i,ink:TS.ink[i]})).filter(x=>x.ink);
      if(!list.length||!autoReady())TS.auto='manual';
      else{TS.auto='running';TS.prog=0;TS.fail=0;const T=TS;
        judgeMany(list,(it,a)=>{T.prog++;if(!a)T.fail++;else if(!T.touched[it.i]){T.x[it.i]=a.v==='bad';T.w[it.i]=a.v==='check'}const s=$('#autoStat');if(s)s.textContent=T.prog+' dari '+list.length})
          .then(()=>{T.auto=T.fail===list.length?'manual':'done';if(TS===T&&TAB==='test')renderTest()})}
    }
    const wrong=Object.values(TS.x).filter(Boolean).length,nW=TS.items.filter((_,i)=>TS.w[i]&&!TS.x[i]).length;
    const msg=TS.auto==='running'?`Menilai otomatis, <span id="autoStat">${TS.prog} dari ${TS.ink.filter(Boolean).length}</span>.`
      :TS.auto==='done'?`Baris merah salah menurut penilaian otomatis.${nW?' Baris kuning bentuknya benar, tetapi pastikan ッ, ャ, ュ, ョ, dan vokal kecil memang ditulis kecil.':''} Ketuk baris mana pun untuk mengubah penilaian.`
      :'Bandingkan tulisan Anda dengan jawaban di kanan, lalu ketuk baris yang salah. Huruf kecil yang tidak ditulis kecil dan ー yang terlupa juga dihitung salah.';
    P.innerHTML=`<div class="card"><h3>Nilai jawaban Anda</h3><p class="small" style="margin:0">${msg}</p></div>
    <div class="rl" style="margin-top:10px">${TS.items.map((it,i)=>{const st=TS.x[i]?'x':TS.w[i]?'w':'';return`<button class="ri ${st}" data-i="${i}" aria-pressed="${!!TS.x[i]}"><span class="rom">${esc(R(it))}</span><span class="img">${TS.img[i]?`<img alt="" src="${TS.img[i]}">`:'<span class="muted small">kosong</span>'}</span><span class="a cink" style="--c:${col(it.row)}">${it.k}</span><span class="pill ${st==='x'?'bad':st==='w'?'warn':'ok'}">${st==='x'?'Salah':st==='w'?'Periksa':'Benar'}</span></button>`}).join('')}</div>
    <div class="actions"><button class="btn pri" id="sv" ${TS.auto==='running'?'disabled':''}>Simpan hasil, ${20-wrong} dari 20 benar</button></div>`;
    P.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;TS.touched[i]=true;TS.w[i]=false;TS.x[i]=!TS.x[i];renderTest()});
    $('#sv',P).onclick=()=>{const miss=TS.items.filter((_,i)=>TS.x[i]).map(i=>i.k);TS.items.forEach((it,i)=>grade(it.k,!TS.x[i]));
      const score=20-miss.length;S.tests.push({at:Date.now(),score,total:20,time:Math.round(TS.time)});save();TS.phase='result';TS.miss=miss;TS.score=score;renderTest()};
  }else{const pct=Math.round(TS.score*5);
    P.innerHTML=`<div class="card stack" style="text-align:center;position:relative">${pct>=90?'<div class="hanko" aria-label="Lulus" style="position:static;margin:0 auto">合格</div>':''}<div class="score">${pct}%</div><div class="muted small">${TS.score} dari 20 benar, waktu ${fmt(TS.time)}</div>
    ${TS.miss.length?`<div class="kana" style="font-size:1.4rem;word-spacing:.5em">${TS.miss.map(k=>`<span class="cink" style="--c:${col(BY[k].row)}">${k}</span>`).join(' ')}</div>`:''}
    <p class="small" style="margin:0">${pct>=90?'Di atas 90 persen. Jika Tabel Kosong juga sudah sempurna dua kali berturut-turut, Anda siap tes.':'Latih huruf dan kata yang salah, lalu ulangi simulasi.'}</p>
    <div class="row" style="justify-content:center">${TS.miss.length?'<button class="btn pri" id="dm">Latih yang salah</button>':''}<button class="btn ${TS.miss.length?'':'pri'}" id="ag">Simulasi lagi</button></div></div>`;
    if(TS.miss.length)$('#dm',P).onclick=()=>{DR.mode='weak';DR.only=TS.miss.slice();DR.q=null;TS=null;show('drill')};
    $('#ag',P).onclick=()=>{TS=null;renderTest()};
  }
}

/* ---------- KEYBOARD ---------- */
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('button')&&e.key==='Enter')return;
  const k=TAB==='drill'?DR.keys:TAB==='learn'&&L&&L.step==='recall'?L.keys:TAB==='table'&&TB&&TB.phase==='write'?TB.keys:TAB==='test'&&TS&&TS.phase==='write'?TS.keys:null;
  if(!k)return;
  if(e.key==='Enter'){e.preventDefault();k.check&&k.check()}
  else if(e.key==='ArrowRight'&&k.yes){e.preventDefault();k.yes()}
  else if(e.key==='ArrowLeft'&&k.no){e.preventDefault();k.no()}});

/* ---------- BOOT ---------- */
const h=(location.hash||'').slice(1);
show(RENDER[h]?h:'plan');
})();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}</script>
